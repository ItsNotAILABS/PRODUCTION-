# ============================================================================
# Error Boundary — Auto-Agent Cascade Prevention
#
# This workflow provides a circuit breaker for the organism bot fleet.
# It monitors for excessive commit velocity and cascading failures,
# pausing bot activity when thresholds are exceeded.
#
# Standards:
#   - 873ms heartbeat interval (minimum between bot operations)
#   - Spectral engine standard: max 6 bot commits per hour
#   - Circuit breaker: disable all bots if >12 commits/hour from bots
# ============================================================================

name: "🛑 Error Boundary — Agent Circuit Breaker"

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes - health check

permissions:
  contents: read
  actions: read

concurrency:
  group: error-boundary
  cancel-in-progress: true

jobs:
  circuit-breaker:
    name: "🛑 Cascade Detection"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Check commit velocity
        id: velocity
        run: |
          echo "🛑 Error Boundary — Commit Velocity Check"
          echo "═══════════════════════════════════════════"
          
          # Count bot commits in last hour
          ONE_HOUR_AGO=$(date -d '1 hour ago' --iso-8601=seconds 2>/dev/null || date -v-1H +%Y-%m-%dT%H:%M:%S)
          BOT_COMMITS=$(git log --since="$ONE_HOUR_AGO" --oneline | grep -c "bot:" || echo "0")
          
          echo "Bot commits in last hour: $BOT_COMMITS"
          echo "bot_commits=$BOT_COMMITS" >> $GITHUB_OUTPUT
          
          # 873ms heartbeat standard = ~4125 max operations/hour
          # But for commits, max 6/hour is the safe threshold
          if [ "$BOT_COMMITS" -gt 12 ]; then
            echo "🚨 CIRCUIT BREAKER TRIGGERED: $BOT_COMMITS bot commits/hour exceeds threshold (12)"
            echo "breaker_tripped=true" >> $GITHUB_OUTPUT
          elif [ "$BOT_COMMITS" -gt 6 ]; then
            echo "⚠️ WARNING: $BOT_COMMITS bot commits/hour approaching threshold (6 recommended, 12 max)"
            echo "breaker_tripped=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Commit velocity nominal: $BOT_COMMITS/hour (threshold: 6)"
            echo "breaker_tripped=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for push conflicts
        run: |
          echo ""
          echo "Checking for recent force-push or merge conflicts..."
          # Look for signs of race conditions in recent history
          RECENT_REVERTS=$(git log --oneline -20 | grep -ci "revert\|conflict\|merge" || echo "0")
          echo "Recent conflict indicators: $RECENT_REVERTS"
          
          if [ "$RECENT_REVERTS" -gt 3 ]; then
            echo "⚠️ Multiple conflict indicators detected — bots may be racing"
          else
            echo "✅ No conflict indicators"
          fi

      - name: Report status
        run: |
          echo ""
          echo "═══════════════════════════════════════════"
          echo "🏥 ORGANISM HEALTH STATUS"
          echo "═══════════════════════════════════════════"
          echo "  Heartbeat Standard:  873ms"
          echo "  Spectral Engine:     ACTIVE"
          echo "  Bot Velocity:        ${{ steps.velocity.outputs.bot_commits }}/hour"
          echo "  Circuit Breaker:     ${{ steps.velocity.outputs.breaker_tripped && 'TRIPPED' || 'OK' }}"
          echo "  Recommendation:      ${{ steps.velocity.outputs.bot_commits > 6 && 'REDUCE BOT FREQUENCY' || 'NOMINAL' }}"
          echo "═══════════════════════════════════════════"
