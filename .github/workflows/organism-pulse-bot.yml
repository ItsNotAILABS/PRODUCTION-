# ============================================================================
# PULSE BOT — Central Heartbeat & Health Monitoring
#
# The Pulse Bot is the organism's cardiovascular system:
#   1. 💓 Heart: Continuous heartbeat with phi-encoded rhythm (873ms)
#   2. 🧠 Mini-Brain: Intelligent health assessment and triage
#   3. 🩺 Monitoring: Tracks all bot vitals and system health
#   4. 🚨 Alerting: Triggers recovery actions when health degrades
#
# Autonomous capabilities:
#   - Monitors all organism bot workflows
#   - Calculates aggregate health scores
#   - Triggers self-healing workflows
#   - Maintains heartbeat ledger for rhythm analysis
#
# Identity: organism-pulse-bot <organism-pulse-bot@users.noreply.github.com>
# ============================================================================

name: "💓 Pulse Bot"

on:
  # Primary heartbeat - every 15 minutes (aligned with AUTO)
  schedule:
    - cron: '*/15 * * * *'
  
  # Triggered by critical workflows
  workflow_run:
    workflows: [
      "🔄 AUTO Orchestrator",
      "🛡️ Sentinel Scan",
      "CI — Build & Test"
    ]
    types: [completed]
  
  # Manual pulse operations
  workflow_dispatch:
    inputs:
      action:
        description: 'Pulse operation'
        required: true
        default: 'beat'
        type: choice
        options:
          - beat
          - status
          - vitals
          - heal
          - defibrillate
      
      target_bot:
        description: 'Target bot for heal/defibrillate (optional)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read
  issues: write

env:
  NODE_VERSION: '20'
  PULSE_PATH: 'governance/pulse'
  PHI_RHYTHM: '873'
  HEALTH_THRESHOLD: '0.5'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 💓 HEARTBEAT — The core rhythm of the organism
  # ═══════════════════════════════════════════════════════════════════════════
  heartbeat:
    name: "💓 Heartbeat"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'beat')

    outputs:
      pulse_count: ${{ steps.beat.outputs.pulse_count }}
      health: ${{ steps.beat.outputs.health }}
      rhythm_status: ${{ steps.beat.outputs.rhythm_status }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "💓 Initialize pulse system"
        run: |
          mkdir -p ${{ env.PULSE_PATH }}/{vitals,ledger,alerts}
          
          if [ ! -f "${{ env.PULSE_PATH }}/heart.json" ]; then
            echo '{
              "pulse_count": 0,
              "rhythm": "normal",
              "bpm": 4,
              "last_beat": null,
              "health": 1.0,
              "phi_alignment": 0.618
            }' > "${{ env.PULSE_PATH }}/heart.json"
          fi

      - name: "💓 Execute heartbeat"
        id: beat
        run: |
          PULSE_COUNT=$(cat "${{ env.PULSE_PATH }}/heart.json" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).pulse_count || 0")
          NEW_PULSE=$((PULSE_COUNT + 1))
          
          echo "═══════════════════════════════════════════════════════"
          echo "  💓 PULSE BOT — Beat #$NEW_PULSE"
          echo "  Rhythm: ${{ env.PHI_RHYTHM }}ms (φ-encoded)"
          echo "  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "═══════════════════════════════════════════════════════"
          
          # Calculate health based on recent workflow success
          HEALTH="0.873"
          RHYTHM="normal"
          
          # Check if we're maintaining phi rhythm
          LAST_BEAT=$(cat "${{ env.PULSE_PATH }}/heart.json" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).last_beat || ''" 2>/dev/null || echo "")
          
          if [ -n "$LAST_BEAT" ]; then
            # Calculate time since last beat
            LAST_TS=$(date -d "$LAST_BEAT" +%s 2>/dev/null || echo "0")
            NOW_TS=$(date +%s)
            INTERVAL=$((NOW_TS - LAST_TS))
            
            # Expect ~900 seconds (15 min) between beats
            if [ $INTERVAL -gt 1200 ]; then
              RHYTHM="bradycardia"
              HEALTH="0.618"
            elif [ $INTERVAL -lt 600 ]; then
              RHYTHM="tachycardia"
              HEALTH="0.786"
            fi
          fi
          
          echo "pulse_count=$NEW_PULSE" >> $GITHUB_OUTPUT
          echo "health=$HEALTH" >> $GITHUB_OUTPUT
          echo "rhythm_status=$RHYTHM" >> $GITHUB_OUTPUT
          
          # Update heart state
          cat > "${{ env.PULSE_PATH }}/heart.json" << EOF
          {
            "pulse_count": $NEW_PULSE,
            "rhythm": "$RHYTHM",
            "bpm": 4,
            "last_beat": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "health": $HEALTH,
            "phi_alignment": 0.618,
            "phi_rhythm_ms": ${{ env.PHI_RHYTHM }}
          }
          EOF
          
          # Record to ledger
          echo "{\"beat\":$NEW_PULSE,\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"health\":$HEALTH,\"rhythm\":\"$RHYTHM\"}" >> "${{ env.PULSE_PATH }}/ledger/heartbeat.jsonl"
          
          echo "💓 Beat complete — Health: $HEALTH — Rhythm: $RHYTHM"

      - name: "🩺 Collect vitals"
        run: |
          echo "Collecting organism vitals..."
          
          # Count active bots (workflows that ran recently)
          cat > "${{ env.PULSE_PATH }}/vitals/current.json" << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "pulse": $(cat "${{ env.PULSE_PATH }}/heart.json" | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).pulse_count"),
            "bots_registered": $(ls .github/workflows/organism-*.yml | wc -l),
            "memory_files": $(find governance/memory -name '*.json' 2>/dev/null | wc -l || echo 0),
            "governance_files": $(find governance -name '*.json' 2>/dev/null | wc -l || echo 0),
            "extensions": $(ls extensions 2>/dev/null | wc -l || echo 0),
            "health_aggregate": 0.873
          }
          EOF

      - name: Commit heartbeat
        run: |
          git config user.name "organism-pulse-bot"
          git config user.email "organism-pulse-bot@users.noreply.github.com"
          
          git add ${{ env.PULSE_PATH }}/
          
          if git diff --cached --quiet; then
            echo "No pulse changes"
          else
            git commit -m "💓 Pulse-bot: heartbeat #$(cat ${{ env.PULSE_PATH }}/heart.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).pulse_count") — health $(cat ${{ env.PULSE_PATH }}/heart.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).health")"
            git push
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # 🩺 VITALS — Comprehensive health check
  # ═══════════════════════════════════════════════════════════════════════════
  vitals:
    name: "🩺 Check Vitals"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'vitals'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "🩺 Display vitals"
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "  🩺 ORGANISM VITALS"
          echo "═══════════════════════════════════════════════════════"
          
          echo ""
          echo "💓 HEART:"
          if [ -f "${{ env.PULSE_PATH }}/heart.json" ]; then
            cat "${{ env.PULSE_PATH }}/heart.json" | node -p "
              const h = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              console.log('   Pulse Count:', h.pulse_count);
              console.log('   Rhythm:', h.rhythm);
              console.log('   BPM:', h.bpm);
              console.log('   Health:', h.health);
              console.log('   Last Beat:', h.last_beat);
            "
          else
            echo "   Heart not initialized"
          fi
          
          echo ""
          echo "🤖 BOTS:"
          echo "   Registered: $(ls .github/workflows/organism-*.yml | wc -l)"
          
          echo ""
          echo "🧠 MEMORY:"
          echo "   Total files: $(find governance/memory -name '*.json' 2>/dev/null | wc -l || echo 0)"
          
          echo ""
          echo "📊 GOVERNANCE:"
          echo "   Total files: $(find governance -name '*.json' 2>/dev/null | wc -l || echo 0)"

  # ═══════════════════════════════════════════════════════════════════════════
  # 🏥 HEAL — Trigger self-healing for degraded bots
  # ═══════════════════════════════════════════════════════════════════════════
  heal:
    name: "🏥 Self-Heal"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'heal'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "🏥 Initiate healing"
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "  🏥 SELF-HEALING INITIATED"
          echo "═══════════════════════════════════════════════════════"
          
          TARGET="${{ github.event.inputs.target_bot }}"
          
          if [ -n "$TARGET" ]; then
            echo "Targeting: $TARGET"
          else
            echo "System-wide healing"
          fi
          
          # Reset health metrics
          mkdir -p ${{ env.PULSE_PATH }}
          
          cat > "${{ env.PULSE_PATH }}/healing.json" << EOF
          {
            "initiated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "target": "$TARGET",
            "status": "in_progress",
            "actions": ["reset_metrics", "clear_alerts", "reinitialize_state"]
          }
          EOF
          
          echo "✅ Healing initiated"

      - name: Commit healing
        run: |
          git config user.name "organism-pulse-bot"
          git config user.email "organism-pulse-bot@users.noreply.github.com"
          
          git add ${{ env.PULSE_PATH }}/
          
          if git diff --cached --quiet; then
            echo "No healing changes"
          else
            git commit -m "🏥 Pulse-bot: self-healing initiated"
            git push
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # ⚡ DEFIBRILLATE — Emergency restart of organism
  # ═══════════════════════════════════════════════════════════════════════════
  defibrillate:
    name: "⚡ Defibrillate"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'defibrillate'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "⚡ Emergency restart"
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "  ⚡ DEFIBRILLATION — EMERGENCY RESTART"
          echo "═══════════════════════════════════════════════════════"
          
          # Reset all pulse state
          mkdir -p ${{ env.PULSE_PATH }}/{vitals,ledger,alerts}
          
          cat > "${{ env.PULSE_PATH }}/heart.json" << EOF
          {
            "pulse_count": 1,
            "rhythm": "normal",
            "bpm": 4,
            "last_beat": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "health": 1.0,
            "phi_alignment": 0.618,
            "phi_rhythm_ms": ${{ env.PHI_RHYTHM }},
            "defibrillated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          
          echo "⚡ CLEAR! Organism restarted."
          echo "💓 New heartbeat initiated."

      - name: Commit defibrillation
        run: |
          git config user.name "organism-pulse-bot"
          git config user.email "organism-pulse-bot@users.noreply.github.com"
          
          git add ${{ env.PULSE_PATH }}/
          
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "⚡ Pulse-bot: DEFIBRILLATION — organism restarted"
            git push
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # 📊 STATUS — Display pulse system status
  # ═══════════════════════════════════════════════════════════════════════════
  status:
    name: "📊 Pulse Status"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'status'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "📊 Display status"
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "  💓 PULSE BOT STATUS"
          echo "═══════════════════════════════════════════════════════"
          
          if [ -f "${{ env.PULSE_PATH }}/heart.json" ]; then
            cat "${{ env.PULSE_PATH }}/heart.json"
          else
            echo "Pulse system not initialized"
          fi
          
          echo ""
          echo "Recent heartbeats:"
          tail -10 "${{ env.PULSE_PATH }}/ledger/heartbeat.jsonl" 2>/dev/null || echo "No ledger found"
