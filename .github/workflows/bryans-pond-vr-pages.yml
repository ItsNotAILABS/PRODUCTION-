name: Bryan's Pond VR Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/bryans-pond-vr/**'
      - '.github/workflows/bryans-pond-vr-pages.yml'
  pull_request:
    paths:
      - 'apps/bryans-pond-vr/**'
      - '.github/workflows/bryans-pond-vr-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bryans-pond-vr-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bryans-pond-vr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run certify
      - run: npm run build -- --base=/PRODUCTION-/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/bryans-pond-vr/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
