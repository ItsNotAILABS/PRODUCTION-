name: CI — Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 18 was removed, not skipped. The test suite is ESM and
        # package.json declares no "type", so loading it depends on Node's
        # module detection — backported to 20.19 and default from 22. On 18
        # that machinery does not exist and 2,598 of 3,940 tests fail in the
        # CJS loader before any assertion runs. Node 18 also reached
        # end-of-life in April 2025. Testing against a runtime the code cannot
        # execute on produced a wall of failures that said nothing about the
        # code. 20 and 22 both pass 4,234/4,234.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate manifests
        run: node scripts/lint-manifests.js

      - name: Run tests
        # `dot` rather than the default TAP reporter. TAP emits ~300KB per run,
        # which pushes the actual failures far enough up the log that neither
        # the Actions UI nor the API's log tail can reach them — a red job that
        # cannot tell you what broke costs more than it saves. The dot reporter
        # prints one character per test and the full failure detail at the end,
        # where it is always readable. Exit code semantics are unchanged.
        run: node --test --test-reporter=dot test/**/*.test.js

  build-extensions:
    name: Build & Commit Extensions
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate icons (if missing)
        run: node scripts/generate-icons.js

      - name: Build extension zips
        run: bash build-extensions.sh

      - name: Commit dist/ if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes to dist/"
          else
            git commit -m "build: rebuild extension zips [skip ci]"
            git push
          fi
