# ============================================================================
# Deploy Sonic Ninja Lab Pages — Autonomous Production Hosting
#
# Deploys the download page, download worker, and all extension source files
# to GitHub Pages. The download page becomes a live, permanent, self-hosted
# download portal.
#
# FIXED: Added concurrency control, bot-commit filtering, and path filters
# to prevent cascading CI/CD failures from high-velocity auto-agent commits.
# ============================================================================

name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'download.html'
      - 'docs.html'
      - 'documents.html'
      - 'tools.html'
      - 'protocols.html'
      - 'sandbox-labs.html'
      - 'alpha-tools.html'
      - 'research/**'
      - 'dist/extensions/**'
      - 'dist/webapp/**'
      - 'dist/download.html'
      - 'assets/**'
      - 'CNAME'
      - 'robots.txt'
    paths-ignore:
      - 'docs/fleet-report.md'
      - 'docs/runtime-report.md'
      - 'docs/crawler-report.md'
      - 'docs/security-report.md'
      - 'docs/intel-picture.md'
      - 'docs/cloud-report.md'
      - 'docs/governance-report.md'
      - 'dist/governance/**'
      - 'dist/recordings/**'
      - 'dist/screenshots/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    # Skip deployment if commit is from auto-agent bots
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[bot-report]')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
