name: "🤖 Agent Coordination Request"
description: "Request multi-agent task coordination"
title: "[COORDINATION] "
labels: ["agent-generated", "coordination"]
body:
  - type: markdown
    attributes:
      value: |
        ## Agent Coordination Request
        Use this template to request coordination between agents for complex tasks.

  - type: input
    id: task
    attributes:
      label: Task Description
      description: "What needs to be accomplished?"
      placeholder: "Run security scan and deploy if clean"
    validations:
      required: true

  - type: input
    id: capabilities
    attributes:
      label: Required Capabilities
      description: "Comma-separated list of required capabilities"
      placeholder: "scan, test, deploy"
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - critical
        - high
        - normal
        - low
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: "Any additional information for the coordinating agents"
    validations:
      required: false

  - type: checkboxes
    id: governance
    attributes:
      label: Governance Check
      options:
        - label: "I confirm this request does not violate CPL-L laws"
          required: true
        - label: "I confirm fleet health is not RED"
          required: false
