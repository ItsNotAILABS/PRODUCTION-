; Cloudflare Container: all-in-one deployment with sidecar processes
;
; This runs four core processes:
; 1. core-api: FastAPI web service (2 gunicorn workers)
; 2. core-worker: Inner agent scheduler (housekeeping jobs)
; 3. optimizer-julia: Week optimization engine (native)
; 4. taskrules-haskell: Task language parser (native)
;
; All services run on localhost with port forwarding:
; - core-api: 8000 (routed by Worker script)
; - optimizer-julia: 8100 (falls back to Python if unavailable)
; - taskrules-haskell: 8200 (falls back to Python if unavailable)
;
; Each process is monitored and auto-restarted on failure. The system
; degrades gracefully: if Julia or Haskell go down, the Python fallbacks
; keep the app working. Health checks are available at /health/system.

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
strip_ansi=false

; IPC socket for supervisorctl (Unix domain socket)
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Process groups for coordinated operations
[group:computation-engines]
programs=optimizer-julia,taskrules-haskell
priority=100

[group:platform-services]
programs=core-api,core-worker
priority=200

[program:core-api]
; FastAPI web service — serves HTTP requests from the Worker script
; (load-balanced across 2 gunicorn workers for concurrency)
command=gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:8000 --access-logfile - --error-logfile - --timeout 30
directory=/app/core-api
environment=ENABLE_INNER_AGENT="false",OPTIMIZER_URL="http://127.0.0.1:8100",TASKRULES_URL="http://127.0.0.1:8200"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=200

[program:core-worker]
; Inner agent scheduler — runs housekeeping jobs for all accounts
; (pressure recompute, week continuity checks, library registry scans).
; Must run as a single process to avoid firing jobs N times.
command=python3 worker.py
directory=/app/core-api
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=210

[program:optimizer-julia]
; Julia week optimization engine (native computation)
; Runs the real scheduling algorithm; Python fallback if unavailable.
; Increase startsecs if Julia startup is slow (it compiles on first run).
command=julia --project=/app/optimizer-julia /app/optimizer-julia/src/Optimizer.jl
environment=PORT="8100"
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=100

[program:taskrules-haskell]
; Haskell task language parser (native computation)
; Parses the compact task DSL; Python fallback if unavailable.
command=/app/taskrules-bin/taskrules
environment=PORT="8200"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=110
