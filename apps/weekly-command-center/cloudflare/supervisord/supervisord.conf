; Runs core-api, the inner-agent worker, the Julia optimizer, and the
; Haskell task-language parser as sidecar processes inside one Cloudflare
; Container. This is what "Julia and Haskell embedded" means concretely on
; Cloudflare: containers can't reach each other by hostname the way
; docker-compose services can (only the Worker script has bindings to route
; between separate containers), so instead of three containers we run three
; processes on one container's localhost — core-api's existing
; OPTIMIZER_URL=http://127.0.0.1:8100 / TASKRULES_URL=http://127.0.0.1:8200
; defaults work unmodified.
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:core-api]
command=gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:8000 --access-logfile - --error-logfile -
directory=/app/core-api
environment=ENABLE_INNER_AGENT="false",OPTIMIZER_URL="http://127.0.0.1:8100",TASKRULES_URL="http://127.0.0.1:8200"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:core-worker]
; the single process that runs the inner agent's scheduler — see
; core-api/worker.py and the comment in core-api/app/main.py about why this
; is split out rather than run inside every gunicorn worker.
command=python3 worker.py
directory=/app/core-api
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:optimizer-julia]
command=julia --project=/app/optimizer-julia /app/optimizer-julia/src/Optimizer.jl
environment=PORT="8100"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:taskrules-haskell]
command=/app/taskrules-bin/taskrules
environment=PORT="8200"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
