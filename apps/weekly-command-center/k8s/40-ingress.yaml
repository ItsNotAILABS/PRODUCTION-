# Requires an ingress controller (nginx-ingress, etc.) and cert-manager for
# automatic TLS. Replace app.yourdomain.com with your real domain — it must
# match CORS_ORIGINS in 02-configmap.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wcc-ingress
  namespace: weekly-command-center
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["app.yourdomain.com"]
      secretName: wcc-tls
  rules:
    - host: app.yourdomain.com
      http:
        paths:
          # Stripe webhooks and all other API traffic go to core-api directly.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: core-api
                port: { number: 8000 }
          # Everything else (static frontend + its own /api proxy) via gateway-node.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-node
                port: { number: 3000 }
