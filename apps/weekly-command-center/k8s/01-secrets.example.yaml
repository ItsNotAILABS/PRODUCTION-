# Template only — do NOT apply as-is or commit real values.
#
# Copy to 01-secrets.yaml (gitignored), fill in real values, and apply:
#   kubectl apply -f 01-secrets.yaml
#
# Or, preferably, create these from your CI/CD secret store instead of a
# file on disk, e.g.:
#   kubectl create secret generic wcc-secrets \
#     --namespace weekly-command-center \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 32)" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=STRIPE_API_KEY="sk_live_..." \
#     --from-literal=STRIPE_WEBHOOK_SECRET="whsec_..." \
#     --from-literal=SENDGRID_API_KEY="SG...."
apiVersion: v1
kind: Secret
metadata:
  name: wcc-secrets
  namespace: weekly-command-center
type: Opaque
stringData:
  POSTGRES_USER: wcc
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: weekly_command_center
  JWT_SECRET: "REPLACE_ME"
  # Optional — only needed once you have a real Stripe account
  STRIPE_API_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  # Optional — pick one email provider; empty vars fall back to console-log
  SENDGRID_API_KEY: ""
  SENDGRID_FROM_EMAIL: "noreply@yourdomain.com"
