<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loom Code — live demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1117'/%3E%3Cpath d='M8 8h3v13h8v3H8z' fill='%232f81f7'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#0d1117; --panel:#151b23; --panel2:#1c232c; --ink:#e6edf3; --muted:#8b98a5;
    --line:#252d38; --accent:#2f81f7; --good:#3fb950; --warn:#d29922; --bad:#f85149;
    --exact:#3fb950; --likely:#58a6ff; --ambig:#d29922; --ext:#8b98a5;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,monospace;
    --sans:-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
  .app{display:grid;grid-template-rows:auto auto 1fr auto auto;height:100vh}

  header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  .logo{font-weight:700;letter-spacing:-.02em;font-size:15px}
  .logo span{color:var(--accent)}
  .badge{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
  .badge.live{color:var(--good);border-color:#1f4a2c}
  .spacer{flex:1}

  .step{color:var(--muted);font-family:var(--mono);font-size:11.5px;padding:9px 20px;border-bottom:1px solid var(--line);background:var(--panel2)}

  main{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);overflow:hidden}
  .col{background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
  .colhead{padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:8px}
  .colhead .tag{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:3px}
  .tag.old{background:#3a1d1d;color:#ff9c8f}
  .tag.new{background:#12301c;color:var(--good)}
  .body{flex:1;overflow:auto;padding:14px 16px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;line-height:1.55}

  .meter{display:flex;gap:22px;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel2);
    font-family:var(--mono);font-size:11.5px;align-items:center;flex-wrap:wrap}
  .m{display:flex;flex-direction:column;gap:1px}
  .m .k{color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
  .m .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .v.good{color:var(--good)} .v.bad{color:var(--bad)}

  footer{padding:12px 20px;border-top:1px solid var(--line);background:var(--panel);
    display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input,button{font:inherit;font-family:var(--mono);font-size:13px}
  input{flex:1;min-width:200px;background:var(--bg);color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:9px 12px}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:9px 18px;font-weight:600;cursor:pointer}
  button.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:default}

  .hit{padding:6px 9px;border:1px solid var(--line);border-radius:5px;margin-bottom:6px;background:var(--panel)}
  .hit .n{color:var(--accent);font-weight:600}
  .hit .loc{color:var(--muted);font-size:11px}
  .sig{font-size:10px;color:var(--muted)}
  .dim{color:var(--muted)}
  .tier{display:block;margin:10px -16px 4px;padding:3px 16px;background:var(--panel);
    color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  .cite{color:var(--accent);font-size:11px}
  .conf{font-size:10px;padding:1px 5px;border-radius:3px;margin-left:6px}
  .c-exact{background:#12301c;color:var(--exact)}
  .c-likely{background:#0d2b4e;color:var(--likely)}
  .c-ambiguous{background:#3a2d0c;color:var(--ambig)}
  .cut{color:var(--warn);font-size:11px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">loom<span>code</span></div>
    <div class="badge" id="api-badge">connecting…</div>
    <div class="badge" id="repo-badge">no repo</div>
    <div class="badge" id="graph-badge">no graph</div>
    <div class="spacer"></div>
    <div class="badge">the same edit, both ways</div>
  </header>

  <div class="step" id="step">Ready. Press “Run the loop”.</div>

  <main>
    <div class="col">
      <div class="colhead">Without Loom Code <span class="tag old">reads whole files</span></div>
      <div class="body" id="left"><span class="dim">waiting…</span></div>
    </div>
    <div class="col">
      <div class="colhead">With Loom Code <span class="tag new">index → rank → pack</span></div>
      <div class="body" id="right"><span class="dim">waiting…</span></div>
    </div>
  </main>

  <div class="meter">
    <div class="m"><span class="k">whole-file tokens</span><span class="v bad" id="m-full">—</span></div>
    <div class="m"><span class="k">pack tokens</span><span class="v good" id="m-served">—</span></div>
    <div class="m"><span class="k">reduction</span><span class="v good" id="m-ratio">—</span></div>
    <div class="m"><span class="k">tokens avoided</span><span class="v good" id="m-tokens">—</span></div>
    <div class="m"><span class="k">indexed lines</span><span class="v" id="m-lines">—</span></div>
  </div>

  <footer>
    <input id="q" value="optimal price from elasticity" />
    <button id="run">Run the loop</button>
    <button id="reset" class="ghost">Reset</button>
  </footer>
</div>

<script>
const API = new URLSearchParams(location.search).get("api") || "http://127.0.0.1:8899";
const KEY = new URLSearchParams(location.search).get("key") || "";
const REPO = "demo";
const H = { "Authorization": "Bearer " + KEY, "Content-Type": "application/json" };

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const step = (t) => { $("step").textContent = t; };
const esc = (s) => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// The demo indexes real files and then performs a real edit-location task
// against them. Nothing here is pre-baked: every number on screen comes back
// from the API during the run.
const FILES = ["pricing.py", "orders.py"];
const TEXT = {};

async function api(path, opts = {}) {
  const r = await fetch(API + path, { headers: H, ...opts });
  if (!r.ok && r.status !== 409) throw new Error(path + " -> " + r.status);
  return r.json();
}

async function boot() {
  try {
    const h = await (await fetch(API + "/health")).json();
    $("api-badge").textContent = "api " + h.version;
    $("api-badge").classList.add("live");
  } catch { $("api-badge").textContent = "api unreachable"; return; }

  for (const f of FILES) TEXT[f] = await (await fetch("./" + f)).text();
  await api(`/v1/repos/${REPO}/files`, {
    method: "POST",
    body: JSON.stringify({ files: FILES.map(p => ({ path: p, content: TEXT[p] })) }),
  });
  const stats = await api(`/v1/repos/${REPO}/stats`);
  const g = await api(`/v1/repos/${REPO}/graph`);
  $("repo-badge").textContent = `${stats.files} files · ${stats.lines} lines · ${stats.symbols} symbols`;
  $("graph-badge").textContent = `graph ${g.edges} edges · ${g.by_confidence.exact || 0} exact`;
  $("m-lines").textContent = stats.lines.toLocaleString();
  step(`Indexed ${stats.files} files and resolved ${g.edges} call edges. Source was parsed and discarded.`);
}

async function run() {
  $("run").disabled = true;
  const q = $("q").value.trim();

  // ---- left: what an agent does today -----------------------------------
  step("Without Loom Code: the agent cannot tell which file holds the symbol, so it loads both.");
  let all = "", fullBytes = 0;
  for (const f of FILES) {
    fullBytes += new TextEncoder().encode(TEXT[f]).length;
    all += `# ===== ${f} =====\n` +
      TEXT[f].split("\n").map((l, i) => String(i + 1).padStart(4) + " | " + l).join("\n") + "\n\n";
  }
  $("left").textContent = all;
  const fullTokens = Math.ceil(fullBytes / 4);
  $("m-full").textContent = fullTokens.toLocaleString();
  await sleep(1500);

  // ---- right step 1: rank -------------------------------------------------
  step(`Step 1 — rank the index for “${q}”. Lexical, name match and centrality fused. No file content moves.`);
  $("right").innerHTML = "";
  const hits = await api(`/v1/repos/${REPO}/search?q=${encodeURIComponent(q)}&top_k=3`);
  for (const h of hits.results) {
    const d = document.createElement("div");
    d.className = "hit";
    d.innerHTML = `<span class="n">${esc(h.name)}</span> <span class="loc">${esc(h.path)}:L${h.line_start}–${h.line_end}</span>`
                + `<div class="sig">signals ${esc(JSON.stringify(h.signals))} · centrality ${h.centrality}</div>`;
    $("right").appendChild(d);
    await sleep(300);
  }
  await sleep(800);

  // ---- right step 2: pack -------------------------------------------------
  const top = hits.results[0];
  step(`Step 2 — build a context pack around ${top.name}: the span, what it calls, what calls it — under budget.`);
  const pack = await api(`/v1/repos/${REPO}/context_pack`, {
    method: "POST",
    body: JSON.stringify({
      query: q, budget_tokens: 1200,
      files: FILES.map(p => ({ path: p, content: TEXT[p] })),
    }),
  });

  $("right").innerHTML = "";
  let last = null;
  for (const e of pack.elements) {
    if (e.tier !== last) {
      const t = document.createElement("span");
      t.className = "tier"; t.textContent = e.tier;
      $("right").appendChild(t); last = e.tier;
    }
    const head = document.createElement("div");
    head.innerHTML = `<span class="cite">${esc(e.citation)}</span> ${esc(e.name)}`
      + (e.confidence ? `<span class="conf c-${esc(e.confidence)}">${esc(e.confidence)}</span>` : "")
      + ` <span class="sig">${e.tokens}t · ${esc(e.why)}</span>`;
    $("right").appendChild(head);
    const pre = document.createElement("div");
    pre.textContent = e.text;
    $("right").appendChild(pre);
    await sleep(420);
  }
  if (pack.omitted.length) {
    const o = document.createElement("div");
    o.className = "cut";
    o.textContent = "\n" + pack.omitted.map(x =>
      `omitted ${x.tier} ${x.citation} (${x.tokens}t) — ${x.reason}`).join("\n");
    $("right").appendChild(o);
  }

  const used = pack.used_tokens;
  const ratio = (fullTokens / used).toFixed(2);
  $("m-served").textContent = used.toLocaleString();
  $("m-ratio").textContent = ratio + "×";
  $("m-tokens").textContent = (fullTokens - used).toLocaleString();
  step(`Same edit, more context than a raw span — ${used} tokens instead of ${fullTokens}. ${ratio}× less, with citations.`);
  $("run").disabled = false;
}

$("run").addEventListener("click", () => run().catch(e => step("error: " + e.message)));
$("reset").addEventListener("click", () => {
  $("left").innerHTML = '<span class="dim">waiting…</span>';
  $("right").innerHTML = '<span class="dim">waiting…</span>';
  ["m-full","m-served","m-ratio","m-tokens"].forEach(i => $(i).textContent = "—");
  step("Ready. Press “Run the loop”.");
});
boot();
</script>
</body>
</html>
