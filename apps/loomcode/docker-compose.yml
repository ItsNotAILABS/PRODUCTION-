services:
  loomcode:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Change this. Keys are hashed with it; rotating it invalidates every key.
      LOOM_KEY_SALT: "${LOOM_KEY_SALT:?set a salt, e.g. openssl rand -hex 32}"
      LOOM_DB: /data/loomcode.db
    volumes:
      - loomcode-data:/data
    restart: unless-stopped

volumes:
  loomcode-data:
